server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router 的前端路由回退到入口 HTML；真实静态文件仍直接由 Nginx 返回。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 浏览器只访问 Nginx + Java。Java 校验登录态、构造可信用户上下文后，
    # 再以内网 HTTP 调用 Python；此处绝不能配置 Python 的 /api/chat 直通路由。
    location /python-ai/ {
        proxy_pass http://host.docker.internal:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;

        # Java 再转发 Python 的 SSE 时，Nginx 不应缓冲响应，否则浏览器看不到逐块输出。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
